[pytest]
pythonpath = .
testpaths = tests
markers =
    local_assets: 로컬 디스크의 완성 프로덕션 에셋 폴더 존재를 전제로 검증하는 테스트
norecursedirs =
    .git
    .venv
    *legacy*
    *archive*
    output
    temp
    models
    node_modules
filterwarnings =
    ignore::DeprecationWarning:websockets.legacy.*:
    ignore::PendingDeprecationWarning:gradio.*:
    ignore::PendingDeprecationWarning:multipart.*:
    ignore::FutureWarning:torch.*:
    ignore::starlette.exceptions.StarletteDeprecationWarning
