[pytest]
pythonpath = .
testpaths = tests
norecursedirs =
    .git
    .venv
    *legacy*
    *archive*
    output
    temp
    models
    node_modules
filterwarnings =
    ignore::DeprecationWarning:websockets.legacy.*:
    ignore::PendingDeprecationWarning:gradio.*:
    ignore::PendingDeprecationWarning:multipart.*:
    ignore::FutureWarning:torch.*:
    ignore::starlette.exceptions.StarletteDeprecationWarning
